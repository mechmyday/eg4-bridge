name: eg4-bridge (dev version)
version: dev
slug: eg4-bridge-dev
description: Allows local communication with Luxpower inverters and bridges it to MQTT
arch:
- armv7
- aarch64
- amd64
url: "https://github.com/mechmyday/eg4-bridge"
init: false
startup: application
stage: experimental
options:
  loglevel: info
  read_only: false
  strict_data_check: false
  homeassistant_enabled: false
  register_read_interval: 60
  inverter_timeout: 300
  verbose: false
  human_timestamps: false
  show_unknown: false
  inverters:
  - enabled: true
    host: ""
    port: 8000
    serial: ""
    datalog: ""
    heartbeats: false
    publish_holdings_on_connect: false
    use_tcp_nodelay: true
    read_timeout: 900
    register_block_size: 40
    read_only: false
  databases:
  - enabled: false
    url: "postgres://lxp:lxp@localhost/lxp"
  mqtt:
    enabled: true
    host: "localhost"
    port: 1883
    username: ""
    password: ""
    namespace: lxp
    homeassistant:
      enabled: false
      prefix: homeassistant
      publish_all_registers: false
  influx:
    enabled: false
    url: "http://localhost:8086"
    username: ""
    password: ""
    database: "lxp"
  scheduler:
    enabled: false
    timesync_cron: "0 0 * * *"
schema:
  loglevel: list(trace|debug|info|warn|error|off)
  read_only: bool
  strict_data_check: bool
  homeassistant_enabled: bool
  register_read_interval: int(1,)
  inverter_timeout: int(1,)
  verbose: bool
  human_timestamps: bool
  show_unknown: bool
  inverters:
  - enabled: bool
    host: str
    port: port
    serial: str
    datalog: str
    heartbeats: bool?
    publish_holdings_on_connect: bool?
    use_tcp_nodelay: bool?
    read_timeout: int(1,)?
    register_block_size: int(1,40)?
    delay_ms: int(0,)?
    read_only: bool?
    register_read_interval: int(1,)?
  databases:
  - enabled: bool
    url: url
  mqtt:
    enabled: bool
    host: str
    port: port
    username: str?
    password: password?
    namespace: str
    homeassistant:
      enabled: bool
      prefix: str
      publish_all_registers: bool?
    publish_individual_input: bool?
  influx:
    enabled: bool
    url: url
    username: str?
    password: password?
    database: str
  scheduler:
    enabled: bool
    timesync_cron: str?
